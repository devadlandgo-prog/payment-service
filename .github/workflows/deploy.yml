name: Deploy Payment Service to ECS

on:
  # Lets a deploy be re-run without an empty commit - needed when the image has
  # to be rebuilt for a reason that is not a code change, such as moving to a
  # new AWS account or rotating a build-time secret.
  workflow_dispatch:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

env:
  AWS_REGION: ca-central-1
  ECR_REPOSITORY: landgo-dev-payment-service
  ECS_CLUSTER: landgo-dev-cluster
  ECS_SERVICE: landgo-dev-payment-service
  CONTAINER_NAME: payment-service

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    name: Build & Deploy
    # ARM64 runner so `docker build` produces a Graviton image natively.
    # The ECS task definitions for this service are ARM64 (20% cheaper on both
    # vCPU-hours and GB-hours); an x86 image in an ARM64 task definition fails
    # at startup with "exec format error", so the two must move together.
    #
    # Native ARM rather than buildx + QEMU: emulating a Maven build would add
    # several minutes per run, and ARM runners are free for public repos.
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run tests
        run: ./mvnw verify -B

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Docker image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # ECR tag mutability is IMMUTABLE and the tag is the commit SHA, so
          # rebuilding the same commit cannot push - "tag invalid ... already
          # exists". That made workflow_dispatch useless: a redeploy always died
          # on the push step. Reuse the existing image instead; it is
          # byte-identical anyway, because the commit has not changed.
          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" \
               --image-ids imageTag="$IMAGE_TAG" >/dev/null 2>&1; then
            echo "::notice::Image $IMAGE_TAG already in ECR; reusing it and redeploying."
          else
            docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
            docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          fi
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition $ECS_SERVICE \
            --query 'taskDefinition' \
            --output json > task-definition.json

          jq 'del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' \
            task-definition.json > clean-task-definition.json
          mv clean-task-definition.json task-definition.json

      - name: Update ECS task definition with new image
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
          wait-for-minutes: 10
