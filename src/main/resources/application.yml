server:
  port: ${SERVER_PORT:8083}
  forward-headers-strategy: framework

spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://localhost:5432/landgo
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 180000
      max-lifetime: 240000
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: payments
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: ${LIQUIBASE_DEFAULT_SCHEMA:payments}
    liquibase-schema: ${LIQUIBASE_SCHEMA:payments}
    database-change-log-table: ${LIQUIBASE_CHANGELOG_TABLE:databasechangelog_payments}
    database-change-log-lock-table: ${LIQUIBASE_CHANGELOG_LOCK_TABLE:databasechangeloglock_payments}
    drop-first: false

app:
  jwt:
    secret: ${JWT_SECRET:myVeryLongSecretKeyThatIsAtLeast256BitsForHS256Algorithm2024!}
  services:
    user-service-url: ${USER_SERVICE_URL:http://localhost:8081}
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:sk_test_123}
    publishable-key: ${STRIPE_PUBLISHABLE_KEY:pk_test_123}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_123}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    mail:
      enabled: false

logging:
  level:
    root: INFO
    com.landgo: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: INFO
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
